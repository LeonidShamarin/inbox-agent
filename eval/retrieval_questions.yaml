# Питання для оцінки пошуку по базі знань.
#
# `section` — розділ регламенту, який МАЄ бути знайдений. Розмітка робилась
# руками по data/kb/, тому вона точна, але й набір маленький: 25 питань — це
# оцінка порядку величини, а не статистика.
#
# Група `out_of_corpus` — питання, на які в базі відповіді немає. Вони
# перевіряють протилежне: що пошук МОВЧИТЬ, а не повертає найсхожіший розділ.

in_corpus:
  - question: скільки днів відпустки на рік
    section: Щорічна відпустка
  - question: за скільки попередити керівника про відпустку
    section: Щорічна відпустка
  - question: чи згорають невикористані дні відпустки
    section: Щорічна відпустка
  - question: що робити якщо захворів
    section: Лікарняний
  - question: коли подати медичний документ
    section: Лікарняний
  - question: як компенсується робота у вихідний
    section: Відгул і робота у вихідний
  - question: хто погоджує закупівлю на 1500 EUR
    section: Ліміти погодження
  - question: хто погоджує покупку на 15000 євро
    section: Ліміти погодження
  - question: чи можна розбити закупівлю на кілька заявок
    section: Ліміти погодження
  - question: як подати заявку на закупівлю
    section: Як подати заявку
  - question: за скільки днів оплачують рахунок
    section: Строки оплати
  - question: відшкодування витрат без чека
    section: Відшкодування особистих витрат
  - question: хто видає доступи до систем
    section: Хто видає доступи
  - question: що отримує новий співробітник у перший день
    section: Стандартний набір для нового співробітника
  - question: забув пароль від корпоративного акаунта
    section: Втрачений або скомпрометований пароль
  - question: зламали мій акаунт що робити
    section: Втрачений або скомпрометований пароль
  - question: коли відкликаються доступи при звільненні
    section: Звільнення співробітника
  - question: куди писати якщо не працює пошта
    section: Куди звертатися
  - question: за скільки годин реагують на критичний збій
    section: Строки реакції
  - question: як часто міняють ноутбук
    section: Обладнання
  - question: хто має доступ до продакшену
    section: Доступ до продакшн-середовища
  - question: о котрій можна ставити зустрічі
    section: Робочі години і сині зони
  - question: скільки триває зустріч за замовчуванням
    section: Тривалість
  - question: за скільки скасовувати зустріч
    section: Скасування
  - question: як швидко відповідати клієнтам
    section: Відповіді на зовнішні запити

out_of_corpus:
  - хто президент Марса
  - яка столиця Франції
  - порадь фільм на вечір
  - скільки коштує біткоїн
  - хто виграв чемпіонат світу
  - як приготувати борщ
  - дякую, гарного дня
